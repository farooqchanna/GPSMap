name: Build GPS Map Camera APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle wrapper
        run: |
          chmod +x ./gradlew
          grep -q 'gradle-8.9-' gradle/wrapper/gradle-wrapper.properties || \
            sed -i 's#gradle-[0-9.]*-\(bin\|all\)\.zip#gradle-8.9-all.zip#' gradle/wrapper/gradle-wrapper.properties

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPSMapCamera-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
